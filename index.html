const allQs=worlds.flatMap(w=>w.questions).concat(schoolUnits.flatMap(w=>w.questions));const qById=Object.fromEntries(allQs.map(q=>[q.id,q]));
const defaultData=()=>({version:1,diagnostic:null,missions:{},school:{},cards:{},attempts:[],stars:0,created:Date.now()});let data=load();let page='home',session=null,choice=null,assembled=[],inputValue='',feedback=null,attemptCount=0,firstChecked=false,firstCorrect=false,showTranscript=false,voicesStatus='';let activeTranslations={};let voicePreference='auto';try{voicePreference=localStorage.getItem('eq_en_voice')||'auto'}catch(e){}
function load(){try{let d=JSON.parse(localStorage.getItem(STORE));if(d&&d.version===1&&d.cards&&d.missions&&Array.isArray(d.attempts)){d.school=d.school||{};return d;}}catch(e){}return defaultData()}
function save(){try{localStorage.setItem(STORE,JSON.stringify(data));return true}catch(e){return false}}
function escape(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const norm=s=>String(s||'').trim().toLocaleLowerCase('en').replace(/[.!?,;:]/g,'').replace(/[’']/g,"'").replace(/\s+/g,' ');
function tkey(s){return String(s??'').toLocaleLowerCase('en').trim().replace(/[.!?,;:]+$/g,'').replace(/\s+/g,' ')}
function english(s){return /[A-Za-z]/.test(String(s??''))}
function russianFor(s){return translations[tkey(s)]||''}
function availableEnglishVoices(){try{return window.speechSynthesis&&typeof window.speechSynthesis.getVoices==='function'?window.speechSynthesis.getVoices().filter(v=>/^en([-_]|$)/i.test(v.lang)):[]}catch(e){return []}}
const feminineVoices=['samantha','serena','karen','moira','tessa','ava','victoria','jenny','aria','susan','zira','kate','libby','allison','fiona','veena','emma','shelley','joanna','ivy','salli','amy','nicole'];
function chooseEnglishVoice(){let vv=availableEnglishVoices();if(!vv.length)return null;
 if(voicePreference!=='auto'){let selected=vv.find(v=>(v.voiceURI||v.name+'|'+v.lang)===voicePreference);if(selected)return selected}
 for(const name of feminineVoices){let v=vv.find(x=>x.name.toLowerCase().includes(name));if(v)return v}
 return vv.find(x=>/female|woman/i.test(x.name))||vv.find(x=>/^en-gb$/i.test(x.lang))||vv.find(x=>/^en-us$/i.test(x.lang))||vv[0]
}
function voiceName(){const v=chooseEnglishVoice();return v?v.name:'голос устройства'}
function speak(text){if(!('speechSynthesis' in window)||typeof SpeechSynthesisUtterance==='undefined'){voicesStatus='Озвучка на этом устройстве недоступна. Можно прочитать английскую фразу и открыть перевод.';render();return}
 try{const synth=window.speechSynthesis;synth.cancel();const voice=chooseEnglishVoice();
 let utterance=new SpeechSynthesisUtterance(String(text??'').replace(/_{2,}/g,' ... '));
 utterance.lang=voice?.lang||'en-GB';if(voice)utterance.voice=voice;
 utterance.rate=.88;utterance.pitch=1.02;utterance.volume=1;
 utterance.onerror=e=>{if(e.error==='interrupted'||e.error==='canceled')return;voicesStatus='Не удалось воспроизвести звук. Проверь громкость и выбери другой голос в разделе «Взрослым».';render()};
 synth.speak(utterance)
 }catch(e){voicesStatus='Воспроизведение недоступно. Проверь громкость и попробуй ещё раз.';render()}}
function stopVoice(){if('speechSynthesis'in window)window.speechSynthesis.cancel()}
function totalDone(){return Object.keys(data.missions).filter(k=>data.missions[k]?.completed).length}
function dueCards(){return Object.entries(data.cards).filter(([id,c])=>qById[id]&&c.due<=Date.now()).sort((a,b)=>a[1].due-b[1].due).map(([id])=>qById[id])}
function weakCards(){return Object.entries(data.cards).filter(([id,c])=>qById[id]&&(c.lastCorrect===false||c.streak===0)).map(([id])=>qById[id])}
function recommend(){if(data.diagnostic?.score<=3)return 0;let completed=totalDone();return Math.min(completed,worlds.length-1)}
function goto(p){stopVoice();page=p;session=null;feedback=null;render();window.scrollTo({top:0,behavior:'instant'})}
function begin(mode,index){stopVoice();let questions=mode==='diagnostic'?diagnostic:mode==='review'?dueCards().slice(0,8):mode==='school'?schoolUnits[index].questions:worlds[index].questions;if(!questions.length&&mode==='review')questions=weakCards().slice(0,8);if(!questions.length){goto(mode==='school'?'school':'map');return}session={mode,index,questions,pos:0,firstRight:0,started:Date.now(),results:[]};page='lesson';resetQuestion();render();window.scrollTo(0,0)}
function resetQuestion(){choice=null;assembled=[];inputValue='';feedback=null;attemptCount=0;firstChecked=false;firstCorrect=false;showTranscript=false;voicesStatus='';activeTranslations={}}
function current(){return session?.questions[session.pos]}
function answer(){const q=current();if(!q)return '';return q.kind==='order'?assembled.join(' '):q.kind==='text'?inputValue:choice??''}
function canSubmit(){return !feedback?.done&&norm(answer()).length>0}
function record(q,correct){if(session.mode==='diagnostic')return;let old=data.cards[q.id]||{streak:0,total:0,correct:0};let streak=correct?old.streak+1:0;let intervals=[0,1,3,7,14,30];data.cards[q.id]={streak,total:old.total+1,correct:old.correct+(correct?1:0),lastCorrect:correct,due:Date.now()+(correct?intervals[Math.min(streak,5)]*DAY:0),last:Date.now()};data.attempts.push({id:q.id,skill:q.skill,correct,date:Date.now(),mode:session.mode});if(data.attempts.length>2000)data.attempts=data.attempts.slice(-2000);save()}
function submit(){const q=current();if(!q||!canSubmit())return;let correct=norm(answer())===norm(q.correct);attemptCount++;if(!firstChecked){firstChecked=true;firstCorrect=correct;session.results.push({id:q.id,skill:q.skill,correct});if(correct)session.firstRight++;record(q,correct)}if(correct){feedback={done:true,type:'good',title:attemptCount===1?'Верно! ⭐':'Получилось! 🌟',detail:q.explain||''};if(attemptCount===1){data.stars+=1;save()}}else if(attemptCount===1){feedback={done:false,type:'help',title:'Хорошая попытка — попробуем ещё! 💡',detail:q.hint||'Посмотри на задание ещё раз.'};if(q.kind==='choice')choice=null;else if(q.kind==='order')assembled=[];else inputValue=''}else{feedback={done:true,type:'help',title:'Разберём вместе 🤝',detail:'Правильный ответ: '+q.correct+'. '+(q.explain||'')+' Мы ещё повторим эту тему.'}}render();if(!feedback.done&&q.kind==='text')document.getElementById('answer-input')?.focus()}
function advance(){if(!session||!feedback?.done)return;if(session.pos<session.questions.length-1){session.pos++;resetQuestion();render();window.scrollTo({top:0,behavior:'smooth'})}else completeSession()}
function completeSession(){stopVoice();const s=session;if(s.mode==='diagnostic'){data.diagnostic={score:s.firstRight,total:s.questions.length,results:s.results,date:Date.now()};save()}else if(s.mode==='mission'){let old=data.missions[s.index];data.missions[s.index]={completed:true,best:Math.max(old?.best||0,s.firstRight),last:s.firstRight,date:Date.now(),runs:(old?.runs||0)+1};save()}else if(s.mode==='school'){let old=data.school[s.index];data.school[s.index]={completed:true,best:Math.max(old?.best||0,s.firstRight),last:s.firstRight,date:Date.now(),runs:(old?.runs||0)+1};save()}session={...s};page='finish';render();window.scrollTo(0,0)}
function topbar(){const tabs=[['home','🏠 Главная'],['map','🗺️ Острова'],['school','📗 Учебник'],['words','📖 Словарик'],['parent','📊 Взрослым']];return `<header class="top"><div class="brand"><span class="brand-emoji" aria-hidden="true">🦉</span><span>English <span style="color:#8157d1">Quest</span></span></div><nav class="nav" aria-label="Главное меню">${tabs.map(([key,label])=>`<button type="button" data-action="go" data-page="${key}" class="${page===key?'active':''}" ${page===key?'aria-current="page"':''}>${label}</button>`).join('')}</nav></header>`}
function sidebar(){const done=totalDone();const next=dueCards().length;return `<aside class="side"><div class="sidecard"><h3>🏆 Твои открытия</h3><div class="statrow"><span>Звёзды за ответы</span><strong>${data.stars} ⭐</strong></div><div class="statrow"><span>Пройдено островов</span><strong>${done} / ${worlds.length}</strong></div><div class="progress" role="progressbar" aria-label="Пройдено островов" aria-valuemin="0" aria-valuemax="6" aria-valuenow="${done}"><div style="width:${done/6*100}%"></div></div><p>Звёзды — за старание и первый правильный ответ. Здесь нет штрафов за ошибки.</p></div><div class="sidecard"><h3>🧠 Сундучок памяти</h3><p>${next?`Тебя ждут ${next} ${plural(next,'задание','задания','заданий')} для повторения.`:'Повторение появится после первых занятий или когда придёт время освежить знания.'}</p><button class="btn secondary small" data-action="review" ${!next&&!weakCards().length?'disabled':''}>Повторить слова и правила</button></div></aside>`}
function plural(n,a,b,c){let x=Math.abs(n)%100,y=x%10;return x>10&&x<20?c:y===1?a:y>=2&&y<=4?b:c}
function worldCards(){return `<div class="worlds">${worlds.map((w,i)=>{let s=data.missions[i],rec=recommend();return `<button class="world ${i===rec?'active':''}" data-action="mission" data-index="${i}" aria-label="Начать урок: ${escape(w.name)}"><div style="display:flex;justify-content:space-between;align-items:start"><span class="emoji" aria-hidden="true">${w.emoji}</span><span class="stars">${s?.completed?'⭐'.repeat(Math.max(1,Math.ceil((s.best||0)/8*3))):'✦'}</span></div><h3>${i+1}. ${escape(w.name)}</h3><p>${escape(w.desc)}</p><span class="status ${s?.completed?'':i===rec?'recommended':'todo'}">${s?.completed?'Пройдено · ещё раз':i===rec?'Советуем начать здесь':'Начать приключение'}</span></button>`}).join('')}</div>`}
function home(){let had=Boolean(data.diagnostic);return `<div class="shell"><main class="main"><section class="hero"><span class="eyebrow">✨ Игровой английский · 4 класс</span><h1>Открой волшебный мир английского!</h1><p class="lead">Привет, исследовательница! Я совёнок Оли. Вместе мы будем разгадывать загадки, знакомиться с героями и собирать английские фразы. Ошибаться можно — так мы учимся.</p><div class="hero-art" role="img" aria-label="Сказочные острова, совёнок и волшебный замок"><span>🏝️</span><span>🦉</span><span>🏰</span><span>🌈</span></div><div class="actions">${had?`<button class="btn" data-action="go" data-page="map">🗺️ Продолжить приключение</button>`:`<button class="btn" data-action="diagnostic">🚀 Начать с мини-игры</button>`}<button class="btn secondary" data-action="go" data-page="map">Посмотреть острова</button></div></section><div class="sectionhead"><h2>Твои приключения</h2><span class="tag">6 островов · 48 заданий</span></div>${worldCards()}<section class="panel soft" style="margin-top:22px"><span class="eyebrow">📗 Школьная программа</span><h2>Учимся по Spotlight 4</h2><p class="subtle">Первая часть учебника: приветствия, семья, рабочий день, еда и животные. 5 коротких игровых миссий с объяснениями на русском.</p><button class="btn green" data-action="go" data-page="school">Открыть задания по учебнику →</button></section><div class="footer">Обучение без регистрации, рекламы и общения с незнакомцами. Прогресс хранится только в этом браузере.</div></main>${sidebar()}</div>`}
function schoolPage(){let done=Object.values(data.school).filter(x=>x.completed).length;return `<div class="shell"><main class="main"><section class="hero"><span class="eyebrow">📗 Spotlight 4 · Student’s Book · Part 1</span><h1>Учимся по школьному учебнику</h1><p class="lead">Выбирай тему, которую сейчас проходишь в школе. Совёнок объяснит правило, а затем предложит короткую игру. Все задания в приложении составлены специально для тренировки — страницы книги и аудиозаписи не копируются.</p><div class="hero-art" aria-hidden="true"><span>📗</span><span>🦉</span><span>✏️</span></div><div class="actions"><span class="tag">Пройдено тем: ${done} / ${schoolUnits.length}</span><span class="tag">30 новых заданий</span></div></section><div class="sectionhead"><h2>Первая часть · 5 тем</h2></div><div class="worlds">${schoolUnits.map((w,i)=>{let m=data.school[i];return `<button class="world ${m?.completed?'active':''}" data-action="school-unit" data-index="${i}" aria-label="Начать тему ${escape(w.name)}"><span class="emoji">${w.emoji}</span><span class="tag" style="margin-left:8px">${escape(w.pages)}</span><h3>${i===0?'Старт': 'Модуль '+i}. ${escape(w.name)}</h3><p><strong>${escape(w.topic)}</strong></p><p style="margin-top:10px">${escape(w.rule)}</p><span class="status ${m?.completed?'':'recommended'}">${m?.completed?'Пройдено · повторить':'Начать тренировку →'}</span></button>`}).join('')}</div><p class="footer">Тренировки дополняют учебник и не заменяют задания, чтение и аудиоматериалы издательства. Прогресс хранится на этом устройстве.</p></main>${sidebar()}</div>`}
function map(){return `<div class="shell"><main class="main"><div class="panel soft"><span class="eyebrow">🗺️ Карта путешествия</span><h1>Выбирай остров</h1><p class="lead">Проходи миссии в любом порядке. Мы советуем начать с острова, который отмечен цветом. Уже пройденный урок можно пройти ещё раз.</p>${!data.diagnostic?`<button class="btn secondary" data-action="diagnostic">🔎 Сначала определить уровень</button>`:`<p class="mini">Мини-игра пройдена: ${data.diagnostic.score} из ${data.diagnostic.total}. Это стартовая подсказка, а не школьная оценка.</p>`}</div><div class="sectionhead"><h2>Шесть островов</h2></div>${worldCards()}</main>${sidebar()}</div>`}
function phraseActions(text,key,label='Английская фраза',translationOverride=''){const translation=translationOverride||russianFor(text);const show=Boolean(activeTranslations[key]);return `<div class="interact-phrase"><div class="mini">${escape(label)}</div><div class="english-phrase" lang="en">${escape(text)}</div><div class="voice-tools"><button type="button" class="mini-voice" data-action="speak" data-text="${escape(text)}" aria-label="Прослушать английскую фразу">🔊 Послушать</button><button type="button" class="mini-voice" data-action="translate" data-key="${escape(key)}" data-text="${escape(text)}" aria-expanded="${show}">🇷🇺 ${show?'Скрыть перевод':'Показать перевод'}</button></div>${show?`<div class="translation-result" role="status">${escape(translation||'Перевод для этой фразы ещё не добавлен.')}</div>`:''}</div>`}
function questionBody(q){if(q.kind==='choice'||q.kind==='listen'){return `<div class="choices" role="group" aria-label="Варианты ответа">${q.options.map((op,i)=>{const eng=english(op);const key='option-'+i;const trans=Boolean(activeTranslations[key]);return `<div class="choice-wrap ${eng?'':'plain'}"><button type="button" class="choice ${choice===op?'selected':''}" data-action="select" data-value="${escape(op)}" aria-pressed="${choice===op}" ${feedback?.done?'disabled':''}><span class="letter">${'ABC'[i]}</span><span>${escape(op)}</span></button>${eng?`<button type="button" class="mini-voice" data-action="speak" data-text="${escape(op)}" aria-label="Послушать: ${escape(op)}">🔊</button><button type="button" class="mini-voice" data-action="translate" data-key="${key}" data-text="${escape(op)}" aria-expanded="${trans}" aria-label="Показать перевод: ${escape(op)}">🇷🇺</button>${trans?`<div class="translation-result" role="status">${escape(russianFor(op)||'Перевод для этого варианта ещё не добавлен.')}</div>`:''}`:''}</div>`}).join('')}</div>`}
if(q.kind==='text'){return `<label for="answer-input" class="mini">Твой ответ на английском:</label><input class="answer" id="answer-input" data-action="typing" type="text" maxlength="100" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Напиши ответ здесь" value="${escape(inputValue)}" ${feedback?.done?'disabled':''}><p class="mini">Регистр букв и конечная точка не влияют на проверку.</p>`}if(q.kind==='order'){return `<p class="mini">Нажимай на слова в правильном порядке. Чтобы убрать слово, нажми на него в строке ответа.</p><div class="assembly" role="group" aria-label="Собранное предложение">${assembled.length?assembled.map((w,i)=>`<button type="button" class="token" data-action="remove-token" data-index="${i}" ${feedback?.done?'disabled':''}>${escape(w)} ×</button>`).join(''):'<span class="mini">Здесь появится твоё предложение…</span>'}</div><div class="wordbank" role="group" aria-label="Слова для предложения">${q.parts.map((w,i)=>{let use=usedPart(q.parts,assembled,i);return `<button type="button" class="token" data-action="add-token" data-index="${i}" ${use||feedback?.done?'disabled':''}>${escape(w)}</button>`}).join('')}</div>`}return ''}
function usedPart(parts,selected,at){const word=parts[at];let sameBefore=parts.slice(0,at+1).filter(x=>x===word).length;let usedCount=selected.filter(x=>x===word).length;return usedCount>=sameBefore}
function lesson(){const q=current(),p=session.pos+1,total=session.questions.length;const isListen=q.kind==='listen';let context=q.context?phraseActions(q.context,'context','📖 Текст истории'):'';let listen=isListen?`<div class="speech"><button class="btn secondary" data-action="speak" data-text="${escape(q.audio)}">🔊 Слушать фразу</button><button class="linkbtn" data-action="transcript">${showTranscript?'Скрыть текст':'Показать текст'}</button></div>${showTranscript?phraseActions(q.audio,'audio','🎧 Текст записи'):''}${voicesStatus?`<p class="mini" role="status">${escape(voicesStatus)}</p>`:''}`:'';return `<main class="lesson"><div class="lesson-top"><button class="back" data-action="go" data-page="${session.mode==='school'?'school':'map'}" aria-label="Вернуться к темам">${session.mode==='school'?'← Учебник':'← Карта'}</button><div class="progress" role="progressbar" aria-label="Прогресс урока" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${session.pos}"><div style="width:${session.pos/total*100}%"></div></div><strong>${p} / ${total}</strong></div><article class="question-card"><div class="meta"><span class="tag">${session.mode==='diagnostic'?'🔎 Знакомство':session.mode==='review'?'🧠 Повторение':session.mode==='school'?escape(schoolUnits[session.index].name):escape(worlds[session.index].name)}</span><span class="skill">${escape(q.skill)}</span></div><div class="scene" aria-hidden="true">${q.scene||'✨'}</div><h2>${escape(q.prompt)}</h2>${promptPhraseTranslations[q.id]?phraseActions(promptPhraseTranslations[q.id][0],'prompt','🗣️ Английское в задании',promptPhraseTranslations[q.id][1]):''}<div class="voice-tag">🎙️ ${escape(voiceName())}</div>${session.mode==='school'&&session.pos===0?`<div class="context" style="font-size:15px"><strong>🦉 Подсказка от совёнка</strong><br>${escape(schoolUnits[session.index].rule)}</div>`: ''}${context}${listen}${questionBody(q)}${feedback?`<div class="feedback ${feedback.type}" role="status" aria-live="polite"><strong>${escape(feedback.title)}</strong>${escape(feedback.detail)}</div>`:''}${feedback?.done&&english(q.correct)?phraseActions(q.correct,'correct-answer','✅ Правильный ответ'):''}<div class="actions">${feedback?.done?`<button class="btn green" data-action="next">${p===total?'🏁 Завершить миссию':'Дальше →'}</button>`:`<button class="btn" data-action="submit" ${!canSubmit()?'disabled':''}>Проверить ответ ✓</button>`}${!feedback?.done&&!feedback?'<span class="mini">Можно подумать сколько нужно 💜</span>':''}</div></article><p class="footer">Одна ошибка — это подсказка, а не поражение. Не спеши.</p></main>`}
function finishScreen(){let s=session,diag=s.mode==='diagnostic',review=s.mode==='review',pct=Math.round(s.firstRight/s.questions.length*100),next=recommend();let nextWorld=worlds[next];let backPage=s.mode==="school"?"school":"map";let text=diag?(s.firstRight<=3?'Начнём с основ и будем постепенно усложнять задания.':s.firstRight<=6?'Отличная основа! Потренируем слова и построение предложений.':'Ты уже многое знаешь! Можно выбирать любой остров и открывать новые темы.'):s.firstRight===s.questions.length?'Все задания с первой попытки — прекрасная концентрация!':'Ты закончила миссию. Ошибки уже превратились в подсказки, а сложные задания попадут в повторение.';return `<main class="lesson"><section class="panel result"><div class="big" aria-hidden="true">${diag?'🦉':review?'🧠':'🏆'}</div><span class="eyebrow">${diag?'Знакомство завершено':review?'Повторение завершено':'Миссия пройдена'}</span><h1>${diag?'Давай дружить!':review?'Память становится крепче!':'Ты открыла новую страницу приключения!'}</h1><p class="summary">${text}</p><div class="resultgrid"><div><strong>${s.firstRight} / ${s.questions.length}</strong>С первой попытки</div><div><strong>${s.questions.length-s.firstRight}</strong>Тем для повторения</div><div><strong>${diag?'🔎':review?'🧠':'⭐'}</strong>${diag?'Без оценок':review?'Тренировка':'За старание'}</div></div><p class="mini">Это результат только этой короткой игры, а не общая оценка владения английским.</p>${!diag&&!review?`<div class="context" style="text-align:left"><strong>🗣️ Маленький разговор</strong><p class="mini">Послушай, скажи вслух два раза, потом попробуй произнести без подсказки. Здесь нет оценки произношения.</p><p lang="en"><strong>${escape((s.mode==='school'?schoolUnits[s.index].speak:speakingLines[s.index])[0])}</strong></p><p class="mini">${escape((s.mode==='school'?schoolUnits[s.index].speak:speakingLines[s.index])[1])}</p><button class="btn secondary small" data-action="speak" data-text="${escape((s.mode==='school'?schoolUnits[s.index].speak:speakingLines[s.index])[0])}">🔊 Послушать фразу</button></div>`:''}<div class="actions" style="justify-content:center"><button class="btn" data-action="${diag?'mission':'go'}" ${diag?`data-index="${next}"`:`data-page="${backPage}"`}>${diag?'🚀 Начать: '+escape(nextWorld.name):s.mode==='school'?'📗 К темам учебника':'🗺️ На карту островов'}</button>${dueCards().length?'<button class="btn secondary" data-action="review">🧠 Повторить сложное</button>':''}</div></section></main>`}
function voicePanel(){const vv=availableEnglishVoices();const picked=chooseEnglishVoice();const options=vv.map(v=>{let value=v.voiceURI||v.name+'|'+v.lang;return `<option value="${escape(value)}" ${voicePreference===value?'selected':''}>${escape(v.name)} (${escape(v.lang)})</option>`}).join('');return `<div class="voice-preferences"><h2>🎙️ Голос английского</h2><p class="subtle">Для английских фраз сначала выбираем доступный на устройстве женский голос. Встроенные голоса Safari, Chrome и Windows могут отличаться по звучанию.</p><label for="voice-select"><strong>Выбрать голос</strong></label><select id="voice-select" aria-label="Выбор английского голоса"><option value="auto" ${voicePreference==='auto'?'selected':''}>Автоматически · женский, если доступен</option>${options}</select><p class="mini">Сейчас выбран: ${escape(picked?.name||'голос устройства')}. ${vv.length?'Можно выбрать другой английский голос.':'Браузер пока не сообщил список голосов. Нажмите «Послушать пример», затем откройте этот раздел ещё раз.'}</p><button type="button" class="btn secondary" data-action="speak" data-text="Hello! My name is Mia. Welcome to English Quest!">🔊 Послушать пример</button></div>`}
function parent(){let at=data.attempts,correct=at.filter(x=>x.correct).length,acc=at.length?Math.round(correct/at.length*100):null;let skills=['Слова','Грамматика','Чтение','Аудирование','Письмо'];let date=data.diagnostic?new Date(data.diagnostic.date).toLocaleDateString('ru-RU'):'не проходилась';let counts=Object.entries(data.missions).filter(([,x])=>x.completed);return `<div class="shell"><main class="main"><section class="panel"><span class="eyebrow">👨‍👩‍👧 Для родителей</span><h1>Прогресс без школьных оценок</h1><p class="lead">Показываем только реальные ответы ребёнка в этом браузере. Процент правильных ответов — показатель выполнения наших заданий, не измерение уровня владения языком и не прогноз успеваемости.</p><div class="parentgrid"><div><strong>${totalDone()}/6</strong><span class="mini">Пройдено тем</span></div><div><strong>${at.length}</strong><span class="mini">Первых попыток</span></div><div><strong>${acc===null?'—':acc+'%'}</strong><span class="mini">Правильно с первого раза</span></div></div>${voicePanel()}<h2>Навыки</h2>${skills.map(skill=>{let a=at.filter(x=>x.skill===skill),ok=a.filter(x=>x.correct).length,v=a.length?Math.round(ok/a.length*100):0;return `<div class="skillrow"><div class="statrow"><span>${skill} <span class="mini">(${a.length} ${plural(a.length,'задание','задания','заданий')})</span></span><strong>${a.length?v+'%':'—'}</strong></div><div class="progress" role="progressbar" aria-label="${skill}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${v}"><div style="width:${v}%"></div></div></div>`}).join('')}<div class="note"><strong>Как заниматься:</strong> 10–15 минут за раз, около 4 раз в неделю. После игры попросите ребёнка самостоятельно произнести 2–3 фразы из урока и рассказать, что они значат. При затруднении возвращайтесь к острову или сундучку памяти; скорость прохождения не важна.</div><h2>По школьному учебнику</h2><div class="reviewlist">${schoolUnits.map((u,i)=>`<div><span>${u.emoji} ${escape(u.name)}</span><span class="mini">${data.school[i]?.completed?data.school[i].best+"/6 с первого раза":"Ещё не пройдено"}</span></div>`).join("")}</div><h2>История островов</h2><div class="reviewlist">${counts.length?counts.map(([i,m])=>`<div><span>${worlds[i].emoji} ${escape(worlds[i].name)}</span><span class="mini">Лучший результат: ${m.best}/8 · ${m.runs} ${plural(m.runs,'проход','прохода','проходов')}</span></div>`).join(''):'<p class="subtle">Пока нет завершённых миссий.</p>'}</div><p class="mini">Стартовая диагностика: ${escape(date)}${data.diagnostic?', '+data.diagnostic.score+' из '+data.diagnostic.total+' ответов с первой попытки':''}. Диагностика ориентировочная и не заменяет работу с учителем.</p><div class="actions"><button class="btn secondary" data-action="diagnostic">Пройти диагностику заново</button><button class="btn secondary" data-action="print">🖨️ Распечатать прогресс</button><button class="linkbtn" data-action="reset">Стереть прогресс на устройстве</button></div></section><section class="panel soft" style="margin-top:15px"><h2>Что входит в игру</h2><p class="subtle">48 заданий на шести островах и восемь стартовых диагностических вопросов. Есть аудирование через встроенный голос браузера, чтение, выбор, набор текста, составление предложений и повторение по интервалам 1, 3, 7, 14 и 30 дней после правильных первых попыток. Ошибки доступны для повторения сразу.</p><p class="subtle"><strong>Ограничения:</strong> приложение не оценивает произношение, свободный разговор и понимание живой речи. Синтезированный голос может отличаться на разных устройствах; кнопка «Показать текст» позволяет продолжить без звука. Для развития говорения нужен разговор с учителем, родителем или собеседником.</p><p class="subtle"><strong>Приватность:</strong> нет входа, аккаунтов, отправки ответов на сервер, рекламы и внешнего чата. Результаты записываются локально в браузере (localStorage) и могут исчезнуть при очистке его данных или при открытии игры на другом устройстве. Игра работает без интернета после сохранения файла.</p></section></main>${sidebar()}</div>`}
function words(){return `<div class="shell"><main class="main"><section class="panel"><span class="eyebrow">📖 Маленький словарик</span><h1>Слова наших островов</h1><p class="lead">Нажми на карточку, чтобы услышать английское слово. Прочитай его вслух, потом вспомни перевод. Если звук не работает, можно читать без него.</p><div class="dictionary">${dictionary.map(([e,en,ru])=>`<button class="dictword" data-action="speak" data-text="${escape(en)}" aria-label="Произнести ${escape(en)}"><strong>${e} ${escape(en)} 🔊</strong><span>${escape(ru)}</span></button>`).join('')}</div>${voicesStatus?`<p role="status" class="mini">${escape(voicesStatus)}</p>`:''}</section></main>${sidebar()}</div>`}
function render(){const app=document.getElementById('app');app.innerHTML=topbar()+(page==='home'?home():page==='map'?map():page==='school'?schoolPage():page==='lesson'?lesson():page==='finish'?finishScreen():page==='words'?words():page==='parent'?parent():home());document.title='English Quest — '+({home:'Главная',map:'Острова',school:'По учебнику',lesson:'Урок',finish:'Миссия пройдена',words:'Словарик',parent:'Прогресс'}[page]||'Английский')}
const app=document.getElementById('app');app.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b||b.disabled)return;let action=b.dataset.action;switch(action){case'go':goto(b.dataset.page);break;case'diagnostic':begin('diagnostic');break;case'mission':begin('mission',Number(b.dataset.index));break;case'school-unit':begin('school',Number(b.dataset.index));break;case'review':begin('review');break;case'select':choice=b.dataset.value;feedback=null;render();break;case'add-token':{let q=current(),i=Number(b.dataset.index);if(!feedback?.done&&!usedPart(q.parts,assembled,i)){assembled.push(q.parts[i]);feedback=null;render()}break}case'remove-token':assembled.splice(Number(b.dataset.index),1);feedback=null;render();break;case'submit':submit();break;case'next':advance();break;case'speak':speak(b.dataset.text);break;case'translate':{let key=b.dataset.key;activeTranslations[key]=!activeTranslations[key];render();break;}case'transcript':showTranscript=!showTranscript;render();break;case'print':window.print();break;case'reset':if(window.confirm('Стереть ВСЕ результаты, звёзды и пройденные уроки на этом устройстве? Это действие нельзя отменить.')){data=defaultData();save();goto('home')}break;}});
app.addEventListener('change',e=>{if(e.target.id==='voice-select'){voicePreference=e.target.value;try{localStorage.setItem('eq_en_voice',voicePreference)}catch(err){}stopVoice();render();}});
if('speechSynthesis' in window&&typeof window.speechSynthesis.addEventListener==='function'){window.speechSynthesis.addEventListener('voiceschanged',()=>{if(page==='parent')render()})}
app.addEventListener('input',e=>{if(e.target.id==='answer-input'){inputValue=e.target.value;const submit=app.querySelector('[data-action="submit"]');if(submit)submit.disabled=!canSubmit()}});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='answer-input'&&!feedback?.done){e.preventDefault();submit()}});
render();
})();
</script>
</body>
</html>
